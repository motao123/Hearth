services:
  hearth:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hearth
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - hearth-data:/app/data
      - hearth-backups:/app/backups
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hearth-data:
  hearth-backups:
