[project]
name = "hearth"
version = "0.1.0"
description = "Self-hosted household hub — tasks, meals, shopping, budget, calendar, and more"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.21",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.18",
    "apscheduler>=3.11",
    "httpx>=0.28",
    "icalendar>=6.1",
    "python-dotenv>=1.1",
    "slowapi>=0.1",
    "lunarcalendar>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.11",
    "alembic>=1.15",
    "lunarcalendar>=0.0.9",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
