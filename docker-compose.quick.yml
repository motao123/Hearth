# Hearth 快速部署 — 直接拉取 Docker Hub 镜像，无需本地构建
# 用法:
#   curl -O https://raw.githubusercontent.com/motao123/Hearth/main/docker-compose.quick.yml
#   mv docker-compose.quick.yml docker-compose.yml
#   echo "HEARTH_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" > .env
#   docker compose up -d
#
# 或使用一键脚本: bash <(curl -s https://raw.githubusercontent.com/motao123/Hearth/main/scripts/quick-start.sh)

services:
  hearth:
    image: imotao/hearth:latest
    container_name: hearth
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - hearth-data:/app/data
      - hearth-backups:/app/backups
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hearth-data:
  hearth-backups:
